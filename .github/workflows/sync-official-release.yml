name: Sync official release

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-official-release
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out deployment fork
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fetch official release tags
        run: |
          git remote add upstream https://github.com/Wei-Shaw/sub2api.git
          git fetch upstream --tags --force

      - name: Publish latest official release for Railway
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh api repos/Wei-Shaw/sub2api/releases/latest --jq .tag_name)"
          target="$(git rev-list -n 1 "${tag}")"
          git fetch origin railway:refs/remotes/origin/railway || true
          current="$(git show origin/railway:.railway-upstream-sha 2>/dev/null || true)"
          if [[ "${current}" == "${target}" ]]; then
            echo "Railway branch already points to ${tag} (${target})."
            exit 0
          fi
          git checkout --detach "${target}"
          sed -i \
            's/id=sub2api-pnpm-store/id=cacheKey-sub2api-pnpm-store/' \
            Dockerfile
          grep -q 'id=cacheKey-sub2api-pnpm-store' Dockerfile
          printf '%s\n' "${target}" > .railway-upstream-sha
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Dockerfile .railway-upstream-sha
          git commit -m "railway: deploy official ${tag}"
          git push --force origin HEAD:refs/heads/railway
          echo "Published ${tag} (${target}) to the Railway deployment branch."
